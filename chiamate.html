<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Chiamate tavoli · San Grato</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Corben:wght@400;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
  <style>
    body { margin: 0; background: #FBF3DA; font-family: 'Nunito Sans', system-ui, sans-serif; color: #4A3B23; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 12px 40px; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-family: 'Corben', Georgia, serif; font-weight: 700; font-size: 28px; color: #E9A722; text-align: center; margin: 0; }
    .sub { text-align: center; font-size: 13px; color: #8A6D3B; margin-top: -8px; }
    h2 { font-family: 'Corben', Georgia, serif; font-size: 16px; color: #C65B2E; margin: 10px 0 0; }
    .griglia { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
    @media (max-width: 720px) { .griglia { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .colonna { display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
    .fila-testa { background: #E9A722; color: #FBF3DA; font-family: 'Corben', Georgia, serif; font-weight: 700; font-size: 20px; text-align: center; padding: 6px 0 2px; border-radius: 12px; }
    .fila-testa.vuota { background: #EFE3BC; color: #B9A26B; }
    .card { background: #FDF8E8; border: 3px solid #C65B2E; border-radius: 14px; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .card.nuova { animation: lampeggia 1s ease-in-out 3; }
    @keyframes lampeggia { 50% { background: #F8E3C0; } }
    .numero { font-family: 'Corben', Georgia, serif; font-weight: 700; font-size: 26px; line-height: 1; color: #4A3B23; padding-top: 4px; }
    .tempo { font-size: 11px; font-weight: 800; color: #C65B2E; }
    .fatto-btn { width: 100%; min-height: 40px; background: #3E8E4F; color: #FBF3DA; font-family: 'Corben', Georgia, serif; font-weight: 700; font-size: 14px; border: none; border-radius: 10px; cursor: pointer; }
    .fatto-btn:disabled { opacity: .5; }
    .servita { background: transparent; border: 2px dashed #E0C480; border-radius: 12px; padding: 6px 12px; display: flex; align-items: center; gap: 10px; opacity: .65; }
    .servita .nome { font-family: 'Corben', Georgia, serif; font-weight: 700; font-size: 14px; flex: 1; }
    .servita .ora { font-size: 12px; font-weight: 700; color: #8A6D3B; }
    .vuoto { text-align: center; font-size: 15px; font-weight: 600; color: #8A6D3B; padding: 16px 10px; }
    .errore { text-align: center; font-size: 14px; font-weight: 700; color: #C65B2E; padding: 20px 10px; line-height: 1.5; }
    .aggiornamento { text-align: center; font-size: 12px; color: #A98F5C; }
    a { color: #D9950F; font-weight: 700; }
    .accesso { max-width: 340px; margin: 20px auto 0; background: #FDF8E8; border: 3px solid #E9A722; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .accesso h2 { margin: 0; text-align: center; color: #E9A722; }
    .accesso input { min-height: 48px; font-size: 17px; font-weight: 700; text-align: center; padding: 0 12px; background: #FBF3DA; border: 2px solid #E0C480; border-radius: 12px; color: #4A3B23; }
    .accesso button { min-height: 50px; background: #E9A722; color: #FBF3DA; font-family: 'Corben', Georgia, serif; font-weight: 700; font-size: 17px; border: none; border-radius: 14px; cursor: pointer; }
    .accesso .msg { text-align: center; font-size: 13px; font-weight: 700; color: #C65B2E; min-height: 18px; }
    .esci { align-self: center; background: transparent; border: 2px dashed #E9A722; color: #C65B2E; font-weight: 700; font-size: 13px; min-height: 40px; padding: 0 18px; border-radius: 12px; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Chiamate tavoli</h1>
  <div class="sub">San Grato · Rivara 2026 — si aggiorna da sola ogni 10 secondi</div>
  <div class="accesso" id="accesso" hidden>
    <h2>Codice staff</h2>
    <input type="password" id="codice-input" placeholder="SG-..." autocomplete="off">
    <button id="btn-accesso">Entra</button>
    <div class="msg" id="msg-accesso"></div>
  </div>
  <div id="contenuto"><div class="vuoto">Caricamento...</div></div>
  <div class="aggiornamento" id="aggiornamento"></div>
  <button class="esci" id="btn-esci" hidden>Esci</button>
</div>

<script>
(function () {
  var FILE = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
  var contenuto = document.getElementById('contenuto');
  var aggiornamento = document.getElementById('aggiornamento');
  var backendUrl = '';
  var idVisti = {};
  var primoGiro = true;
  var CHIAVE = 'sg_staff_code';
  var accesso = document.getElementById('accesso');
  var btnEsci = document.getElementById('btn-esci');
  var msgAccesso = document.getElementById('msg-accesso');
  var timer = null;

  function codice() { try { return localStorage.getItem(CHIAVE) || ''; } catch (e) { return ''; } }

  function chiediCodice(messaggio) {
    if (timer) { clearInterval(timer); timer = null; }
    try { localStorage.removeItem(CHIAVE); } catch (e) {}
    accesso.hidden = false;
    btnEsci.hidden = true;
    contenuto.innerHTML = '';
    aggiornamento.textContent = '';
    msgAccesso.textContent = messaggio || '';
  }

  function avvia() {
    accesso.hidden = true;
    btnEsci.hidden = false;
    carica();
    if (!timer) timer = setInterval(carica, 10000);
  }

  function oraBreve(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function minutiFa(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    if (m === 0) return 'adesso';
    return m + "' fa";
  }

  // "Fila B · tavolo 14" -> { fila: "B", numero: "14" }
  function analizza(testo) {
    var m = /^Fila ([A-H])(?:\s*·\s*tavolo\s*(.+))?$/.exec(testo || '');
    if (m) return { fila: m[1], numero: m[2] || '—' };
    return { fila: null, numero: testo || '?' };
  }

  function segnaFatto(id, bottone) {
    bottone.disabled = true;
    bottone.textContent = '...';
    fetch(backendUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + codice() },
      body: JSON.stringify({ azione: 'fatto', id: id })
    }).then(function (r) {
      if (r.status === 401) { chiediCodice('Codice non valido, inseriscilo di nuovo.'); return; }
      carica();
    }).catch(function () { bottone.disabled = false; bottone.textContent = 'Fatto'; });
  }

  function creaCard(e, orizzontale) {
    var nuova = !primoGiro && !idVisti[e.c.id];
    var card = document.createElement('div');
    card.className = 'card' + (nuova ? ' nuova' : '');
    var n = document.createElement('div');
    n.className = 'numero'; n.textContent = e.numero;
    var t = document.createElement('div');
    t.className = 'tempo'; t.textContent = minutiFa(e.c.ora);
    var b = document.createElement('button');
    b.className = 'fatto-btn'; b.textContent = 'Fatto';
    b.addEventListener('click', function () { segnaFatto(e.c.id, b); });
    if (orizzontale) {
      card.style.flexDirection = 'row';
      card.style.justifyContent = 'space-between';
      card.style.alignItems = 'center';
      card.style.padding = '8px 12px';
      n.style.fontSize = '16px';
      b.style.width = 'auto'; b.style.padding = '0 18px';
    }
    card.appendChild(n); card.appendChild(t); card.appendChild(b);
    if (nuova && navigator.vibrate) navigator.vibrate([200, 100, 200]);
    // Segna la chiamata come "vista" solo se lo schermo e' davvero acceso su questa
    // pagina: altrimenti la vibrazione viene ignorata e il lampeggio finisce inosservato.
    if (document.visibilityState === 'visible') idVisti[e.c.id] = true;
    return card;
  }

  function mostra(chiamate) {
    contenuto.innerHTML = '';
    var attive = chiamate.filter(function (c) { return c.stato !== 'FATTO'; });
    attive.sort(function (a, b) { return a.id - b.id; });
    var servite = chiamate.filter(function (c) { return c.stato === 'FATTO'; }).slice(0, 12);

    var perFila = {};
    FILE.forEach(function (f) { perFila[f] = []; });
    var altre = [];
    attive.forEach(function (c) {
      var info = analizza(c.tavolo);
      if (info.fila) perFila[info.fila].push({ c: c, numero: info.numero });
      else altre.push({ c: c, numero: info.numero });
    });

    var griglia = document.createElement('div');
    griglia.className = 'griglia';
    FILE.forEach(function (f) {
      var col = document.createElement('div');
      col.className = 'colonna';
      var testa = document.createElement('div');
      testa.className = 'fila-testa' + (perFila[f].length === 0 ? ' vuota' : '');
      testa.textContent = f;
      col.appendChild(testa);
      perFila[f].forEach(function (e) {
        col.appendChild(creaCard(e, false));
      });
      griglia.appendChild(col);
    });
    contenuto.appendChild(griglia);

    if (attive.length === 0) {
      var v = document.createElement('div');
      v.className = 'vuoto';
      v.textContent = 'Nessuna chiamata in attesa ✓';
      contenuto.appendChild(v);
    }

    if (altre.length > 0) {
      var h = document.createElement('h2');
      h.textContent = 'Altre chiamate';
      contenuto.appendChild(h);
      altre.forEach(function (e) {
        contenuto.appendChild(creaCard(e, true));
      });
    }

    if (servite.length > 0) {
      var h2 = document.createElement('h2');
      h2.textContent = 'Servite di recente';
      contenuto.appendChild(h2);
      servite.forEach(function (c) {
        var div = document.createElement('div');
        div.className = 'servita';
        var nome = document.createElement('div');
        nome.className = 'nome'; nome.textContent = c.tavolo;
        var o = document.createElement('div');
        o.className = 'ora'; o.textContent = oraBreve(c.ora);
        div.appendChild(nome); div.appendChild(o);
        contenuto.appendChild(div);
      });
    }

    document.title = (attive.length > 0 ? '(' + attive.length + ') ' : '') + 'Chiamate tavoli · San Grato';
    aggiornamento.textContent = 'Ultimo aggiornamento: ' + oraBreve(new Date().toISOString());
    primoGiro = false;
  }

  function carica() {
    if (!backendUrl || !codice()) return;
    fetch(backendUrl + '?azione=lista&v=' + Date.now(), {
      headers: { 'Authorization': 'Bearer ' + codice() }
    })
      .then(function (r) {
        if (r.status === 401) { chiediCodice('Codice non valido o revocato.'); return null; }
        return r.json();
      })
      .then(function (j) { if (j && j.ok) mostra(j.chiamate || []); })
      .catch(function () {
        aggiornamento.textContent = 'Connessione assente, riprovo...';
      });
  }

  document.getElementById('btn-accesso').addEventListener('click', function () {
    var c = document.getElementById('codice-input').value.trim();
    if (!c) { msgAccesso.textContent = 'Inserisci il codice.'; return; }
    msgAccesso.textContent = 'Verifica...';
    fetch(backendUrl + '?azione=lista&v=' + Date.now(), {
      headers: { 'Authorization': 'Bearer ' + c }
    }).then(function (r) {
      if (!r.ok) { msgAccesso.textContent = 'Codice non valido.'; return; }
      try { localStorage.setItem(CHIAVE, c); } catch (e) {}
      document.getElementById('codice-input').value = '';
      msgAccesso.textContent = '';
      avvia();
    }).catch(function () { msgAccesso.textContent = 'Connessione assente.'; });
  });

  btnEsci.addEventListener('click', function () { chiediCodice(''); });

  fetch('config.json?v=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      backendUrl = (cfg.backendUrl || '').trim();
      if (!backendUrl) {
        contenuto.innerHTML = '<div class="errore">Il backend non è ancora attivo.<br>Configuralo dalla <a href="admin.html">dashboard</a>.</div>';
        return;
      }
      if (codice()) avvia(); else chiediCodice('');
    });
})();
</script>
</body>
</html>
